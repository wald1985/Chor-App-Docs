schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Product: Chor-App — a repertoire and rehearsal tracker for a German-speaking
  church/community choir. It is being rebuilt from a legacy single-file
  HTML/Excel tool (still in this repo: chor-app_v3.html, README.md,
  README_old.md) into a real fullstack web app. Treat those legacy
  files as the functional source of truth for business rules until specs
  replace them — read them before writing specs for a capability they cover.

  Repos (kept separate on purpose, no monorepo):
    - chor-app-docs (this repo)   — product specs live here via OpenSpec.
      github.com/wald1985/Chor-App-Docs
    - chor-app-client             — React + TypeScript frontend.
      github.com/wald1985/chor-app-client
    - chor-app-server             — NestJS backend/API.
      github.com/wald1985/chor-app-server
  Each code repo sets up its own package manager/tooling independently
  (not decided yet as of this writing). Planning (propose/spec/design/tasks)
  happens against this docs repo; implementation tasks are then carried out
  in chor-app-client / chor-app-server, which sit as sibling folders on disk.
  Optional: register this repo as an OpenSpec store (`openspec store register
  <path-to-chor-app-docs> --id chor-app --yes`, run from a real terminal so
  the registered path is durable) to query specs with `--store chor-app`
  from the code repos without duplicating openspec/ there.

  Draft domain entity model (candidate bounded contexts, entities, value
  objects, aggregates): domain-model.md in this repo. Treat it as a living
  reference, not final — refine per capability's own design.md as specs are
  written.

  LANGUAGE POLICY (decided 2026-09-15): the target UI/UX is German (the
  audience). The domain model and ALL development — entity/class/field
  names, API, specs, ADRs, code — is English. glossary.md in this repo is
  the single source of truth mapping German UI terms to English
  domain/code names (e.g. Vortrag -> Performance, Chorprobe -> Rehearsal,
  Dirigent -> Conductor, Mappe -> Folder, Gemeinschaft -> Community). Read
  it before naming anything in a spec, design.md, or code — do not
  translate ad hoc, and do not write German identifiers in code. This
  supersedes an earlier "keep German terms in code" instruction from
  initial project setup. Exception (decided 2026-09-16): documentation
  inside chor-app-client and chor-app-server (their docs/ folders, e.g.
  docs/feature/<feature>/) is written in Russian; code, identifiers and
  this repo's specs/ADRs stay English.

  Cross-cutting technical decisions (stack, tooling, conventions — not tied
  to one capability) are recorded as ADRs in decisions/ in this repo, one
  file per decision (decisions/0001-..., see decisions/README.md for the
  format). Treat an Accepted ADR as binding for the affected repo until a
  later ADR supersedes it. So far:
    - decisions/0001-client-stack.md — chor-app-client: React+TS, Redux
      Toolkit for client state only, TanStack React Query for all server
      data (no RTK Query), react-bootstrap (no Tailwind CSS alongside it),
      mobile-first, and a custom fetch-based HTTP utility instead of axios
      (axios explicitly not trusted/not to be added as a dependency).
    - decisions/0002-server-stack.md — chor-app-server: NestJS + Prisma +
      PostgreSQL, DDD with one module per bounded context
      (domain/application/infrastructure/interface sublayers, domain model
      fully isolated from Prisma — no Prisma types or Nest decorators in
      domain/), email via nodemailer/SMTP behind a domain port, API docs
      via @nestjs/swagger on interface-layer DTOs only.
    - decisions/0003-multi-tenancy-identity.md — the system is
      multi-tenant: a Community is the tenant root, created automatically
      when the first user registers; that user becomes Administrator and
      can invite further Users by email (typically conductors, choir
      wardens) via the SMTP capability from ADR 0002 — invite mechanics
      (token/expiry) left to the Identity & Community spec. A User CAN
      belong to multiple Communities (revised 2026-09-15) via a
      CommunityMembership join with a per-membership role; client/session
      needs an active-Community selector. No MusicalGroup/ensemble layer
      inside a Community — deliberately deferred, see the ADR. The Person
      entity (pianist/conductor, used for Reporting) stays separate from
      User with only an optional link, so guest pianists/conductors
      without logins remain supported, and is not shared across
      Communities.
    - decisions/0004-auth-mechanism.md — auth is email+password; a
      successful register/login returns a JWT, sent by the client as
      `Authorization: Bearer <token>` (not a cookie). Implemented as the
      `identity/registration-and-login` capability in chor-app-server.
      Amended with a `tokenVersion` mechanism: changing/resetting a
      password invalidates every other outstanding JWT for that User.
      Self-service password change and emailed forgot/reset-password are
      the `identity/password-management` capability, using the
      `EmailSender`/nodemailer port from ADR 0002 for the first time.
    - decisions/0006-deployment-as-implemented.md (supersedes 0005) —
      both repos run a `checks` job (lint/type-check/test/build) on every
      push and PR; only a push to `main` with green checks builds a Docker
      image and deploys it over SSH to one VPS. Server: Node + `nest
      build`, config from a hand-maintained `.env` on the host,
      `prisma migrate deploy` runs in the deploy before the container is
      replaced. Client: static Vite bundle on nginx; no `.env` on the
      host — the API URL is resolved at runtime from the page's hostname
      (`src/utils/apiConfig.ts`).
    - decisions/0007-community-scoped-requests-and-permissions.md —
      Community-scoped endpoints live under /communities/:communityId/...,
      guarded by membership; hardcoded CommunityPermission set granted per
      MEMBER by the Administrator (ADMINISTRATOR holds all); permissions
      gate changes only.

  Domain glossary (German UI term -> English domain/code name; see
  glossary.md for the full table and maintenance rule):
    - Song (Lied)                 - a song
    - Performance (Vortrag)       - standalone; no Rehearsal required
    - Rehearsal (Chorprobe/Probe) - a session, not a single song
    - WarmUp (Einsingen)          - warm-up portion of a Rehearsal; has its
                                    own leader, chosen from known conductors
    - Conductor (Dirigent)
    - Pianist (Klavierspieler)
    - Theme (Thema/Themen)        - topic tag(s) attached to a song
    - Books / Folder / NewSongs (Buecher / Mappe / Neue Lieder) — the three
      independent song collections (see below)
    - Community (Gemeinschaft)    - a tenant: one choir/group and
                                    everything it owns

  Core capabilities to (re)build, taken from the legacy app (English names
  per glossary.md; German original noted once per capability):
    - Three independent, separately-numbered song collections: Books
      (Bücher 1-4, continuously numbered 1-727, cross-book themes), Folder
      (Mappe: 115 songs, own numbering, no themes), NewSongs (Neue Lieder:
      fully free, user-defined collection). All three can be extended with
      new songs via the "manage songs" (Lieder verwalten) feature.
    - Performance/Rehearsal logging (Vortrag/Chorprobe): record which song
      was sung when, with collection, number, pianist, conductor, note.
      Title/theme are looked up automatically. Rehearsal is session-based:
      create it with a date and WarmUp leader first, then log songs sung
      in it; past sessions are viewable grouped by Rehearsal and
      searchable by title, number, pianist, conductor, or WarmUp leader.
      Performance does NOT require a Rehearsal — a song can be logged as a
      standalone, spontaneous performance with no related rehearsal.
    - Theme search (Themensuche): search Books by theme and/or
      title/number; Folder and NewSongs have their own separate search (no
      theme filter, kept deliberately apart from the cross-book theme
      search).
    - Manage songs (Lieder verwalten): add new songs to any collection;
      attach additional themes to any existing song (pick existing or
      type a new theme name, which then becomes available everywhere).
    - Reporting (Auswertung): usage counts per song (total / Performance /
      Rehearsal), plus separate stats per pianist and per conductor.
    - Data & backup / multi-user: legacy app stores in browser localStorage
      by default, with an optional shared-file sync (OneDrive) that is
      additive-merge only (no delete propagation, no real conflict
      resolution). The new backend (NestJS + PostgreSQL via Prisma) is
      expected to replace this with proper shared multi-user storage,
      scoped per Community (see decisions/0003-multi-tenancy-identity.md).
    - Registration & community setup: registering creates a Community and
      an Administrator User in one step; the Administrator invites further
      Users by email afterward. See
      decisions/0003-multi-tenancy-identity.md.
    - Email: chor-app-server will connect to an SMTP mail server
      (nodemailer, see decisions/0002-server-stack.md) for transactional
      email; confirmed use case: Community invites. Other events that
      might send email are not decided yet — define per capability spec.

  Open architecture decisions not yet made (do not assume an answer —
  surface these as questions or explicit decisions in proposals that touch
  them, and record the outcome as a new ADR in decisions/): invite email
  mechanics (token/expiry/resend — channel itself is decided: email),
  hosting, SMTP server details
  (self-hosted vs. relay/provider), chor-app-server's precise
  bounded-context boundaries, and the client's localization mechanism for
  the German UI (hardcoded strings vs. an i18n layer). Auth mechanism
  itself is decided — see decisions/0004-auth-mechanism.md.

